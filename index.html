<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StoryShelf Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Gloria+Hallelujah&family=Patrick+Hand&family=Caveat&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0b16;
    --accent: #6c5ce0;
    --accent-soft: #8a7cf0;
    --line: #3a3366;
    --ink: #d9d4f2;
    --hand: "Patrick Hand", "Segoe Print", "Comic Sans MS", cursive;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    color: var(--ink);
    font-family: var(--hand);
    overflow: hidden;
    position: relative;
    height: 100vh; height: 100dvh;

    /* Wooden tabletop */
    background-color: #5b351f;

    background-image:

        /* Warm light across the center */
        radial-gradient(
            ellipse at 50% 35%,
            rgba(220, 163, 101, 0.18) 0%,
            transparent 58%
        ),

        /* Darkened edges */
        linear-gradient(
            90deg,
            rgba(25, 12, 6, 0.38) 0%,
            transparent 15%,
            transparent 85%,
            rgba(25, 12, 6, 0.38) 100%
        ),

        /* Natural wood grain */
        repeating-linear-gradient(
            3deg,
            rgba(255, 190, 120, 0.025) 0px,
            rgba(255, 190, 120, 0.025) 3px,
            transparent 4px,
            transparent 15px,
            rgba(40, 18, 7, 0.12) 16px,
            transparent 19px,
            transparent 38px
        ),

        /* Long subtle grain */
        repeating-radial-gradient(
            ellipse at 30% 50%,
            transparent 0px,
            transparent 22px,
            rgba(42, 18, 7, 0.13) 24px,
            transparent 28px,
            transparent 65px
        ),

        /* Individual wooden boards */
        repeating-linear-gradient(
            90deg,
            #704326 0px,
            #704326 310px,
            #5a331e 311px,
            #5a331e 316px,
            #78482a 317px,
            #78482a 620px
        );

    background-attachment: fixed;
  }

  /* Extra natural grain over the tabletop */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;

    background:
        repeating-linear-gradient(
            7deg,
            transparent 0px,
            transparent 32px,
            rgba(25, 10, 4, 0.08) 34px,
            transparent 37px
        );

    opacity: .8;
  }

  /* ---------- NAV ---------- */
  .switch { margin-left: 28px; padding-left: 28px; border-left: 1px solid rgba(255,255,255,.2); display: flex; align-items: center; gap: 12px; font-size: 17px; color: var(--ink, #e8e4f8); }
  .switch small { font-size: inherit; opacity: .75; }
  .switch a { display: inline-flex; align-items: center; gap: 8px; color: inherit; text-decoration: none; padding: 4px 14px; border: 1px solid rgba(255,255,255,.3); border-radius: 999px; transition: background .15s, border-color .15s; }
  .switch a:hover, .switch a:focus-visible { background: rgba(255,255,255,.1); border-color: currentColor; outline: none; }
  .switch svg { width: 22px; height: 17px; }
  @media (max-width: 640px) { .switch { margin-left: 12px; padding-left: 12px; } .switch small { display: none; } }
  nav {
    height: 52px;
    display: flex;
    align-items: center;
    padding: 0 46px;
    position: relative;
    z-index: 5;
  }
  .brand { display: flex; align-items: center; gap: 24px; font-size: 22px; color: var(--ink); }
  .brand svg { width: 38px; height: 28px; }

  /* ---------- HERO ---------- */
  main {
    position: relative;
    z-index: 4;
    max-width: 1000px;
    margin: 0 auto;
    padding: 28px 20px 40px;
    text-align: center;
  }
  .logo { position: relative; width: 520px; max-width: 100%; margin: 0 auto; height: 310px; }
  .logo .crown { position: absolute; left: 50%; top: 0; width: 52px; transform: translateX(-50%); }
  .logo h1 {
    position: absolute; left: 50%; top: 26px; transform: translateX(-50%) rotate(-4deg);
    font-family: "Kaushan Script", cursive; font-weight: 400;
    font-size: min(150px, 15vw); line-height: 1; color: var(--accent);
    text-shadow: 2px 2px 0 rgba(108,92,224,.35), -1px 1px 0 rgba(108,92,224,.25);
    letter-spacing: -2px;
    white-space: nowrap;
  }
  .logo .tracker {
    position: absolute; left: 50%; top: 178px; transform: translateX(-46%) rotate(-3deg);
    font-family: "Gloria Hallelujah", cursive; font-size: 54px; letter-spacing: .26em;
    color: #e6e2f8; white-space: nowrap; padding-left: .26em;
  }
  .logo .swoosh { position: absolute; left: 50%; top: 262px; width: 390px; transform: translateX(-50%); }
  .logo .lookup {
    position: absolute; left: 50%; top: 280px; transform: translateX(-50%);
    font-size: 19px; letter-spacing: .6em; color: var(--accent-soft); padding-left: .6em;
  }

  .tagline { margin-top: 30px; font-size: 22px; line-height: 1.3; color: var(--ink); letter-spacing: .02em; }

  /* ---------- SEARCH ---------- */
  .search {
    margin: 34px auto 0;
    width: 826px; max-width: 100%;
    height: 66px;
    display: flex;
    border: 1.5px solid var(--accent);
    border-radius: 14px;
    background: #0f0c1b;
    overflow: hidden;
    box-shadow: 0 0 0 1px rgba(108,92,224,.12), 0 8px 30px rgba(0,0,0,.35);
  }
  .search label { display: flex; align-items: center; flex: 1; gap: 14px; padding-left: 20px; }
  .search svg { width: 24px; height: 24px; flex: none; }
  .search input {
    flex: 1; height: 100%; background: transparent; border: 0; outline: 0;
    font: 22px var(--hand); color: var(--ink); letter-spacing: .02em;
  }
  .search input { min-width: 0; width: 100%; }
  .search button { flex: none; }
  .search input::placeholder { color: #7f78ad; }
  .search button {
    width: 136px; border: 0; cursor: pointer;
    background: var(--accent); color: #130f26;
    font: 25px var(--hand); letter-spacing: .03em;
    transition: background .15s;
  }
  .search button:hover { background: #7b6cf0; }
  .search:focus-within { border-color: var(--accent-soft); }
  .search button:focus-visible { outline: 2px solid var(--ink); outline-offset: -4px; }

  /* ---------- SERIES CARDS ---------- */
  .card {
    position: absolute; z-index: 2; pointer-events: none;
    --card-w: 180px;
    width: var(--card-w); aspect-ratio: 2 / 3; height: auto;
    border: 3px solid #5a4cc4;
    border-radius: 6px;
    background: linear-gradient(180deg, #4a3fa0, #1c1740);
    box-shadow: 0 14px 34px rgba(0,0,0,.55), 0 0 0 1px rgba(108,92,224,.18);
    overflow: hidden;
  }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; image-rendering: -webkit-optimize-contrast; }

  .c1 { left: 30px;   top: 90px;  transform: rotate(-7deg); }
  .c2 { left: 255px;  top: 385px; transform: rotate(8deg); }
  .c3 { left: 24px;   top: 610px; transform: rotate(-6deg); }
  .c4 { right: 34px;  top: 365px; transform: rotate(7deg); }
  .c5 { right: 275px; top: 625px; transform: rotate(-8deg); }
  .c6 { right: 300px; top: 130px; transform: rotate(6deg); }

  /* ---------- QUOTE ---------- */
  .quote {
    position: absolute; z-index: 1; pointer-events: none;
    right: 50px; top: 120px; width: 150px; transform: rotate(-17deg);
    font-family: "Caveat", cursive; font-size: 34px; line-height: 1.05;
    color: #8d84c9; text-align: left;
  }
  .quote-line {
    position: absolute; z-index: 1; pointer-events: none;
    right: 30px; top: 240px; width: 90px; transform: rotate(-18deg);
    stroke: var(--accent-soft); fill: none; stroke-width: 2.5; stroke-linecap: round; opacity: .75;
  }

  /* slim / mobile: recent searches replace the tagline, covers sit in one even row under the search */
  @media (max-width: 1400px) {
    main { position: relative; z-index: 1; display: flex; flex-direction: column; }
    .logo { order: 1; } .recent { order: 2; } .search { order: 3; } .homemsg { order: 4; } .tagline { display: none; }
    .recent { margin-top: 18px !important; margin-bottom: 0 !important; }
    .card { position: fixed; --card-w: clamp(96px, 14vw, 200px); right: auto !important; bottom: auto !important; z-index: 0; opacity: .97; top: max(58vh, var(--floor, 560px)) !important; }
    .c1 { left: 3%;  transform: rotate(-3deg); }
    .c2 { left: 19%; transform: rotate(2deg); }
    .c3 { left: 35%; transform: rotate(-2deg); }
    .c4 { left: 51%; transform: rotate(3deg); }
    .c5 { left: 67%; transform: rotate(-3deg); }
    .c6 { left: 83%; transform: rotate(2deg); }
    body.nocards .card { display: none; }
  }
  @media (max-width: 640px) {
    .card { --card-w: 22vw; }
    .c1 { left: 3%; } .c2 { left: 27%; } .c3 { left: 51%; } .c4 { left: 75%; }
    .c5, .c6 { display: none; }
  }
  @media (max-width: 1100px) { .quote, .quote-line { display: none; } }
  @media (max-width: 640px) {
    nav { padding: 0 18px; }
    .logo { height: 200px; }
    .logo h1 { font-size: 15vw; top: 18px; }
    .logo .tracker { font-size: 30px; top: 100px; }
    .logo .swoosh { top: 148px; width: 240px; }
    .logo .lookup { top: 164px; font-size: 14px; }
    .search { margin-top: 18px !important; }
    .recent { gap: 8px !important; font-size: 16px !important; }
    .recent button { font-size: 16px !important; padding: 4px 14px !important; }
    .search { height: 56px; }
    .search button { width: 100px; font-size: 20px; }
  }

  /* ---------- status + recent searches ---------- */
  .hidden { display: none !important; }
  .homemsg { min-height: 1.4em; margin: 16px auto 0; font-size: 20px; color: var(--accent-soft); }
  .homemsg.err { color: #ff8fa8; }
  .search button:disabled { opacity: .6; cursor: progress; }
  .recent { width: 826px; max-width: 100%; margin: 26px auto 0; padding: 0 20px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px; color: var(--ink); font-size: 19px; }
  .recent > span { flex: 0 0 100%; display: flex; align-items: center; gap: 16px; text-align: left; margin-bottom: 4px; }
  .recent > span::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .recent button { font: 19px var(--hand); color: var(--ink); background: transparent; border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 20px; cursor: pointer; transition: border-color .15s, background .15s; }
  .recent button:hover, .recent button:focus-visible { border-color: var(--accent-soft); background: rgba(108,92,224,.14); outline: none; }

  /* ---------- coffee on the table ---------- */
  .coffee { position: fixed; left: 16%; top: 8%; width: clamp(120px, 13vw, 240px); height: auto; z-index: 1; pointer-events: none; transform: rotate(-6deg); filter: drop-shadow(10px 16px 14px rgba(20,8,2,.55)) drop-shadow(0 2px 2px rgba(20,8,2,.4)); }
  @media (max-width: 1100px) { .coffee { display: none; } }
  @media (max-height: 900px) { h1 { font-size: min(150px, 15vw, 14vh) !important; } }
</style>
</head>

<script>
const {$,esc,fetchList,errText,writeCache,remember,recents}=Site;
function showRecent(){
  const r=recents(),el=$('recent');
  if(!r.length){el.classList.add('hidden');return}
  el.classList.remove('hidden');
  el.innerHTML='<span>Recent searches</span>'+r.map(n=>`<button type="button" data-u="${esc(n)}">${esc(n)}</button>`).join('');
}
async function go(name){
  name=name.trim();if(!name)return;
  const msg=$('msg'),btn=$('go');
  msg.className='homemsg';msg.textContent='Looking up '+name+'...';btn.disabled=true;
  try{
    const d=await fetchList(name);
    writeCache(d.u.name,d);remember(d.u.name);
    location.href='library.html?user='+encodeURIComponent(d.u.name);
  }catch(e){
    msg.className='homemsg err';msg.textContent=errText(e);btn.disabled=false;
  }
}
$('form').addEventListener('submit',e=>{e.preventDefault();go($('user').value)});
$('recent').addEventListener('click',e=>{const b=e.target.closest('button');if(b){$('user').value=b.dataset.u;go(b.dataset.u)}});
showRecent();
window.addEventListener('pageshow',()=>{$('go').disabled=false;showRecent()});
</script>
<script>
/* keep the floating covers below the search box and the recent searches, so they never sit on top of them */
(function(){
  var root=document.documentElement;
  function lay(){
    var m=document.querySelector('main');if(!m)return;
    var low=0;
    m.querySelectorAll('.logo,.tagline,.search,.homemsg,.recent').forEach(function(el){
      if(el.classList.contains('hidden')||!el.offsetParent)return;
      var b=el.getBoundingClientRect().bottom;if(b>low)low=b;
    });
    var floor=Math.ceil(low+28);
    root.style.setProperty('--floor',floor+'px');
    document.body.classList.toggle('nocards',innerHeight-floor<80);
  }
  addEventListener('resize',lay);addEventListener('load',lay);
  if(window.ResizeObserver)new ResizeObserver(lay).observe(document.querySelector('main'));
  if(window.MutationObserver)new MutationObserver(lay).observe(document.querySelector('main'),{childList:true,subtree:true,attributes:true,attributeFilter:['class']});
  lay();setTimeout(lay,300);
})();
</script>
